plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'rkr.simplekeyboard.inputmethod'
    compileSdk = 35

    defaultConfig {
        applicationId = "rkr.simplekeyboard.inputmethod"
        minSdkVersion = 21
        targetSdkVersion = 34
        versionCode = 132
        versionName = "5.36"
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    implementation 'androidx.autofill:autofill:1.1.0'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.ui:ui:1.7.8'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.7.8'
    implementation 'androidx.compose.foundation:foundation:1.7.8'
    implementation 'androidx.compose.material3:material3:1.3.1'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.7.8'

    // Emoji support with bundled config
    implementation 'androidx.emoji2:emoji2:1.4.0'
    implementation 'androidx.emoji2:emoji2-views:1.4.0'
    implementation 'androidx.emoji2:emoji2-bundled:1.4.0'

    // RecyclerView for emoji grid
    implementation 'androidx.recyclerview:recyclerview:1.3.1'

    // AndroidX Core for ContextCompat and permission handling
    implementation 'androidx.core:core:1.12.0'

    // Material components are still used by the legacy preference/settings surfaces.
    implementation 'com.google.android.material:material:1.14.0-alpha06'

    // Math expression parser for advanced calculator
    implementation 'net.objecthunter:exp4j:0.4.8'
}
