plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'rkr.simplekeyboard.inputmethod'

    // Android 16 QPR2 / API 36.1. AGP 8.13+ understands minor API levels.
    compileSdk {
        version = release(36) {
            it.minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId = "rkr.simplekeyboard.inputmethod"
        minSdkVersion = 24
        targetSdkVersion = 36
        versionCode = 132
        versionName = "5.36"
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    implementation 'androidx.autofill:autofill:1.3.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    // Compose 1.12.x requires API 37 / AGP 9.1+. For the requested SDK 36 target,
    // 1.11.4 is the newest stable Compose core line compatible with this toolchain.
    implementation 'androidx.compose.ui:ui:1.11.4'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.11.4'
    implementation 'androidx.compose.foundation:foundation:1.11.4'
    implementation 'androidx.compose.material3:material3:1.4.0'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.11.4'

    // Emoji2 1.7 is the current stable line and requires API 24+.
    implementation 'androidx.emoji2:emoji2:1.7.0'
    implementation 'androidx.emoji2:emoji2-views:1.7.0'
    implementation 'androidx.emoji2:emoji2-bundled:1.7.0'

    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.core:core:1.19.1'

    // Legacy PreferenceActivity screens still depend on Material Components Views.
    implementation 'com.google.android.material:material:1.14.0'

    implementation 'net.objecthunter:exp4j:0.4.8'
}
